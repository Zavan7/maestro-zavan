[project]
name = "azav-maestro"
version = "1.1.0"
description = "Orquestrador de automações RPA da ZV Labs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.1",
    "django-axes>=8.3.1",
    "dotenv>=0.9.9",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs>=6.1.1",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "types-channels>=4.3.0.20260518",
    "websockets>=17.3",
]

[tool.ruff]
line-length = 79
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D"]
ignore = ["N818", "D214"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# O django-axes não publica tipos.
module = ["axes.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "maestro.settings"
