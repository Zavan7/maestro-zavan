[project]
name = "azav-maestro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1",
    "dotenv>=0.9.9",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
]

[tool.ruff]
line-length = 79
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D"]
ignore = ["N818", "D214"]

[tool.ruff.lint.pydocstyle]
convention = "google"
