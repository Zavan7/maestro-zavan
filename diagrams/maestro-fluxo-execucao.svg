<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fluxo de código de uma execução no Maestro</title>
<desc>Caminho do código desde o clique em rodar robô até o log salvo</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="620" fill="#FFFFFF"/>

<rect x="240" y="20" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">views.py</text>
<text x="340" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">executar_robo(request)</text>

<line x1="340" y1="76" x2="340" y2="106" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="240" y="106" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">@permission_required</text>
<text x="340" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">valida quem pode rodar</text>

<line x1="340" y1="162" x2="340" y2="192" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="240" y="192" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">tasks.py</text>
<text x="340" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">rodar_execucao.delay(id)</text>

<line x1="340" y1="248" x2="340" y2="278" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="240" y="278" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">runner.py</text>
<text x="340" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">executa em container</text>

<line x1="290" y1="334" x2="180" y2="374" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="390" y1="334" x2="500" y2="374" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<text x="200" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">sucesso</text>
<text x="480" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">falha</text>

<rect x="80" y="374" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">models.py</text>
<text x="180" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">status = "sucesso"</text>

<rect x="400" y="374" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="392" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">models.py</text>
<text x="500" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">status = "falha"</text>

<line x1="180" y1="430" x2="180" y2="460" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="500" y1="430" x2="500" y2="460" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="80" y="460" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">audit/signals.py</text>
<text x="180" y="496" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">registra log da ação</text>

<rect x="400" y="460" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">notifications/tasks.py</text>
<text x="500" y="496" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">envia alerta</text>

<line x1="180" y1="516" x2="340" y2="556" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="500" y1="516" x2="340" y2="556" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="240" y="556" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="578" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Painel atualizado</text>
</svg>
