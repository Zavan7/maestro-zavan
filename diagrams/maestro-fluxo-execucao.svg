<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fluxo de código de uma execução no Maestro (estado atual)</title>
<desc>Caminho do código desde o clique em iniciar até o log salvo, mostrando o que já existe hoje via botões manuais e onde entra o agente Go planejado para o futuro</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="560" fill="#FFFFFF"/>

<rect x="240" y="20" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">robots/views.py</text>
<text x="340" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">robot_start(request, pk)</text>

<line x1="340" y1="76" x2="340" y2="106" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="240" y="106" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Execucao.objects</text>
<text x="340" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">cria com status=rodando</text>

<line x1="340" y1="162" x2="340" y2="192" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="80" y="192" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="200" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Hoje: simulado</text>
<text x="200" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">só grava estado no banco</text>

<rect x="360" y="192" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="490" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Futuro: agente Go</text>
<text x="490" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">recebe comando via WebSocket</text>

<line x1="490" y1="248" x2="490" y2="278" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="380" y="278" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="490" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Script RPA (Python)</text>
<text x="490" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">executado na máquina do robô</text>

<line x1="200" y1="248" x2="200" y2="380" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="490" y1="334" x2="200" y2="380" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
<text x="345" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">status + log de volta</text>

<rect x="80" y="380" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">robots/views.py</text>
<text x="200" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">robot_stop grava sucesso/falha</text>

<line x1="200" y1="436" x2="200" y2="466" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="80" y="466" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="200" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Tela de execuções</text>
<text x="200" y="502" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">log visível em /execucoes/id</text>

<rect x="20" y="20" width="14" height="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="40" y="31" font-family="sans-serif" font-size="12" fill="#444441">já implementado</text>
<rect x="20" y="42" width="14" height="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="40" y="53" font-family="sans-serif" font-size="12" fill="#444441">planejado (agente Go)</text>
</svg>
