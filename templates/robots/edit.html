{% extends "base.html" %}
{% load static %}

{% block title %}Editar Robô — Maestro{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/robots.css' %}" />
{% endblock %}

{% block content %}
<div class="page-header">
  <h1>~/robots/{{ robo.id }}/editar</h1>
</div>

<form method="post" class="form-card">
  {% csrf_token %}

  {% include "robots/_campos.html" %}

  <button type="submit" class="btn">salvar alterações</button>
</form>
{% endblock %}
